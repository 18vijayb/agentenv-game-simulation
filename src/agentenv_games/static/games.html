<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agent games</title>
<style>
@font-face { font-family: "Big Shoulders Display"; src: url("/games/static/big-shoulders-display.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
@font-face { font-family: "Literata"; src: url("/games/static/literata.woff2") format("woff2"); font-weight: 200 900; font-display: swap; }
:root {
  --ground: #161e26; --felt: #1e2b35; --felt-edge: #2c3d4a; --ink: #ebe4d2; --muted: #8d9aa5; --faint: #56636e;
  --lib: #5aa9d6; --fas: #e0583a; --gold: #d8ac4a;
  --display: "Big Shoulders Display", "Oswald", "Arial Narrow", Impact, sans-serif;
  --text: "Literata", Georgia, "Times New Roman", serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--ground); color: var(--ink); font-family: var(--text); font-size: 15px; line-height: 1.5; }
body { padding: 24px 16px 40px; }
main { max-width: 1040px; margin: 0 auto; }
h1 { font-family: var(--display); font-weight: 800; font-size: 44px; line-height: 1; margin: 0 0 6px; }
.lede { color: var(--muted); margin: 0 0 24px; max-width: 64ch; }
code { background: var(--felt); padding: 1px 6px; border-radius: 4px; font-size: 13px; }
.wrap { overflow-x: auto; border: 1px solid var(--felt-edge); border-radius: 12px; background: var(--felt); }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 12px 14px; border-bottom: 1px solid var(--felt-edge); vertical-align: top; }
th { font-weight: 600; font-size: 13px; color: var(--muted); }
tr:last-child td { border-bottom: 0; }
tbody tr:hover { background: #22313c; }
td a { color: var(--ink); font-weight: 600; text-decoration-color: var(--gold); text-underline-offset: 3px; }
.players { color: var(--muted); font-size: 13px; max-width: 46ch; }
.players b { color: var(--ink); font-weight: 600; }
.winner { font-size: 14px; }
.winner.liberal { color: var(--lib); }
.winner.fascist { color: var(--fas); }
.pill { font-size: 12px; padding: 1px 9px; border-radius: 10px; font-weight: 600; white-space: nowrap; }
.pill.running { background: var(--fas); color: #2a0d06; }
.pill.failed { background: none; color: var(--gold); box-shadow: inset 0 0 0 1px var(--gold); }
.when { color: var(--muted); font-size: 13px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.empty { padding: 40px 20px; text-align: center; color: var(--muted); }
.empty b { display: block; font-family: var(--display); font-size: 26px; color: var(--ink); margin-bottom: 8px; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <h1>Agent games</h1>
  <p class="lede">Multi-agent games played on this machine. Open one to watch it live while it runs, or to replay it with or without the hidden information.</p>
  <div class="wrap" id="wrap"></div>
</main>
<script>
const esc = t => String(t ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const when = iso => { const d = new Date(iso); return isNaN(d) ? "" : d.toLocaleString([], { dateStyle: "medium", timeStyle: "short" }); };
async function load() {
  let games = [];
  try {
    const r = await fetch("/api/v1/games");
    if (!r.ok) throw new Error(`${r.status} ${r.statusText}`);
    games = (await r.json()).games;
  } catch (err) {
    document.getElementById("wrap").innerHTML = `<div class="empty"><b>Couldn't list games</b>The explorer answered with ${esc(err.message)}.</div>`;
    return;
  }
  if (!games.length) {
    document.getElementById("wrap").innerHTML = `<div class="empty"><b>No games yet</b>Run <code>agent-env run game-prisoners-dilemma</code> to play one with bots, then reload this page.</div>`;
    return;
  }
  const rows = games.map(g => {
    const players = (g.players || []).map(p => p.kind === "bot" ? esc(p.name) : `<b>${esc(p.name)}</b>`).join(", ");
    const result = g.status === "running" ? `<span class="pill running">Live</span>`
      : g.status === "failed" ? `<span class="pill failed">Failed</span>`
      : `<span class="winner ${esc(g.team || "")}">${esc(g.summary || "Finished")}</span>`;
    return `<tr><td><a href="/games/${encodeURIComponent(g.game_id)}">${esc(g.game_id.slice(0, 18))}</a></td><td>${esc(g.title || g.game)}</td>
      <td class="players">${players}</td><td>${result}</td><td class="when">${when(g.started_at)}</td></tr>`;
  }).join("");
  document.getElementById("wrap").innerHTML = `<table><thead><tr><th>Game</th><th>Kind</th><th>Players (AI in bold)</th><th>Result</th><th>Started</th></tr></thead><tbody>${rows}</tbody></table>`;
  if (games.some(g => g.status === "running")) setTimeout(load, 5000);
}
load();
</script>
</body>
</html>
