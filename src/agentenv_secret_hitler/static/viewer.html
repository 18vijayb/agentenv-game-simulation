<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Secret Hitler replay</title>
<style>
@font-face { font-family: "Big Shoulders Display"; src: url("/secret-hitler/static/big-shoulders-display.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
@font-face { font-family: "Literata"; src: url("/secret-hitler/static/literata.woff2") format("woff2"); font-weight: 200 900; font-style: normal; font-display: swap; }
@font-face { font-family: "Literata"; src: url("/secret-hitler/static/literata-italic.woff2") format("woff2"); font-weight: 200 900; font-style: italic; font-display: swap; }
:root {
  --ground: #161e26; --felt: #1e2b35; --felt-edge: #2c3d4a;
  --ink: #ebe4d2; --muted: #8d9aa5; --faint: #56636e;
  --lib: #5aa9d6; --fas: #e0583a; --hitler: #9b1f30; --gold: #d8ac4a;
  --paper: #efe6cf; --paper-ink: #2a2118;
  --display: "Big Shoulders Display", "Oswald", "Arial Narrow", Impact, sans-serif;
  --text: "Literata", Georgia, "Times New Roman", serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--ground); color: var(--ink); font-family: var(--text); font-size: 15px; line-height: 1.5; }
body { padding: 0 16px 16px; min-height: 100vh; display: flex; flex-direction: column; }
button, select { font: inherit; color: inherit; }
a { color: var(--ink); }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
[hidden] { display: none !important; }

.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 22px; padding-block: 14px 12px; }
.bar h1 { font-family: var(--display); font-weight: 800; font-size: 30px; line-height: 1; margin: 0; }
.bar h1 a { text-decoration: none; }
.bar .meta { color: var(--muted); font-size: 13px; }
.live { font-size: 12px; padding: 1px 9px; border-radius: 10px; background: var(--fas); color: #2a0d06; font-weight: 600; }
.bar .spacer { flex: 1; }
.switch { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; font-size: 14px; background: none; border: 0; padding: 4px 0; }
.switch .track { width: 38px; height: 22px; border-radius: 11px; background: var(--felt-edge); position: relative; transition: background .2s; }
.switch .track::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--ink); transition: transform .2s; }
.switch[aria-pressed="true"] .track { background: var(--fas); }
.switch[aria-pressed="true"] .track::after { transform: translateX(16px); }

.stage { flex: 1; display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(300px, 1fr); gap: 16px; min-height: 0; }
.pane { background: var(--felt); border: 1px solid var(--felt-edge); border-radius: 14px; min-width: 0; }
.left { display: flex; flex-direction: column; padding: 14px 16px 16px; }
.tabs { display: flex; gap: 4px; align-items: center; }
.tab { background: none; border: 0; padding: 6px 12px; border-radius: 8px; color: var(--muted); cursor: pointer; font-size: 14px; }
.tab[aria-selected="true"] { background: var(--ground); color: var(--ink); }
.headline { margin-left: auto; font-family: var(--display); font-weight: 700; font-size: 20px; letter-spacing: .02em; text-align: right; }
.headline small { display: block; font-family: var(--text); font-weight: 400; font-size: 12px; color: var(--muted); letter-spacing: 0; }

.table { position: relative; margin-top: 8px; aspect-ratio: 16 / 10.5; min-height: 380px; }
.table::before { content: ""; position: absolute; inset: 9% 7%; border-radius: 50%; background: radial-gradient(ellipse at 50% 45%, #253542 0%, #1c2832 70%); border: 1px solid var(--felt-edge); }
.board { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(50%, 360px); display: grid; gap: 8px; }
.trackrow { display: grid; gap: 4px; padding: 6px; border-radius: 8px; }
.trackrow.lib { grid-template-columns: repeat(5, 1fr); background: color-mix(in oklab, var(--lib) 22%, transparent); }
.trackrow.fas { grid-template-columns: repeat(6, 1fr); background: color-mix(in oklab, var(--fas) 20%, transparent); }
.trackrow.fas.zone { box-shadow: 0 0 0 1px var(--fas), 0 0 18px -4px var(--fas); }
.slot { aspect-ratio: 5 / 7; border-radius: 4px; border: 1px dashed color-mix(in oklab, var(--ink) 25%, transparent); display: grid; place-items: center; text-align: center; font-size: 9px; line-height: 1.1; color: var(--muted); padding: 2px; position: relative; overflow: hidden; }
.slot .card { position: absolute; inset: 0; width: auto; height: auto; }
.boardfoot { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.pips { display: inline-flex; gap: 5px; align-items: center; }
.pip { width: 10px; height: 10px; border-radius: 50%; border: 1px solid var(--muted); }
.pip.on { background: var(--gold); border-color: var(--gold); }
.zonewarn { color: var(--fas); width: 100%; text-align: center; font-size: 12px; }

.card { width: 30px; height: 42px; border-radius: 4px; background: var(--paper); color: var(--paper-ink); display: inline-grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 13px; position: relative; box-shadow: 0 1px 0 rgba(0,0,0,.35); vertical-align: middle; border-top: 9px solid; }
.card.L { border-top-color: var(--lib); }
.card.F { border-top-color: var(--fas); }
.card.back { border-top: 0; background: repeating-linear-gradient(135deg, #b9ad8f 0 3px, #d8ccae 3px 7px); color: transparent; }
.card.gone { opacity: .35; }
.card.gone::after { content: ""; position: absolute; left: -3px; right: -3px; top: 50%; height: 2px; background: var(--paper-ink); transform: rotate(-35deg); }
.card.flip { animation: flip .45s ease-out; }
@keyframes flip { from { transform: rotateY(90deg); } to { transform: none; } }

.seat { position: absolute; transform: translate(-50%, -50%); width: 108px; display: flex; flex-direction: column; align-items: center; gap: 2px; background: none; border: 0; padding: 4px; cursor: pointer; border-radius: 12px; z-index: 1; }
.seat .avatar { width: 50px; height: 50px; border-radius: 50%; display: grid; place-items: center; background: var(--paper); color: var(--paper-ink); font-family: var(--display); font-weight: 800; font-size: 19px; border: 3px solid var(--felt); box-shadow: 0 0 0 2px var(--felt-edge); transition: box-shadow .25s; position: relative; }
.seat .avatar.bot { background: #c9c1ad; }
.seat .name { font-size: 13px; font-weight: 600; white-space: nowrap; max-width: 108px; overflow: hidden; text-overflow: ellipsis; }
.seat .kind { font-size: 10px; color: var(--muted); line-height: 1.1; max-width: 108px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.seat .role { font-size: 11px; padding: 0 7px; border-radius: 8px; line-height: 17px; }
.role.liberal, .r.liberal { background: var(--lib); color: #0f2230; }
.role.fascist, .r.fascist { background: var(--fas); color: #2a0d06; }
.role.hitler, .r.hitler { background: var(--hitler); color: var(--paper); }
.seat .hat { position: absolute; top: -14px; font-size: 11px; padding: 0 8px; line-height: 18px; border-radius: 9px; background: var(--gold); color: #2a2008; font-weight: 600; white-space: nowrap; }
.seat .hat.nom { background: none; color: var(--gold); box-shadow: inset 0 0 0 1px var(--gold); }
.seat .ballot { position: absolute; top: 4px; right: 6px; font-family: var(--display); font-weight: 800; font-size: 13px; padding: 1px 6px; border-radius: 3px; background: var(--paper); color: var(--paper-ink); transform: rotate(8deg); }
.seat .ballot.nein { background: #3a2a2a; color: var(--paper); }
.seat.speaking .avatar { box-shadow: 0 0 0 2px var(--gold), 0 0 22px 2px color-mix(in oklab, var(--gold) 60%, transparent); }
.seat.thinking .avatar { box-shadow: 0 0 0 2px var(--muted), 0 0 0 6px color-mix(in oklab, var(--muted) 25%, transparent); }
.seat.dead { opacity: .4; filter: grayscale(1); }
.seat.dead .avatar::after { content: "✕"; position: absolute; font-size: 34px; color: var(--fas); }
.seat.focus .name { text-decoration: underline; text-decoration-color: var(--gold); text-underline-offset: 3px; }
.bubble { position: absolute; width: 220px; left: 50%; transform: translateX(-50%); background: var(--paper); color: var(--paper-ink); border-radius: 10px; padding: 7px 10px; font-size: 12.5px; line-height: 1.4; text-align: left; box-shadow: 0 6px 20px rgba(0,0,0,.4); z-index: 3; pointer-events: none; max-height: 9.5em; overflow: hidden; }
.bubble.below { top: calc(100% + 6px); }
.bubble.above { bottom: calc(100% + 6px); }
.bubble.thought { background: #2b3843; color: var(--ink); font-style: italic; border: 1px dashed var(--muted); }
.bubble.side-l { left: 0; transform: none; }
.bubble.side-r { left: auto; right: 0; transform: none; }

.legis { margin-top: 12px; border-top: 1px solid var(--felt-edge); padding-top: 12px; display: grid; gap: 10px; min-height: 92px; }
.flow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; font-size: 13px; color: var(--muted); }
.flow .step { display: inline-flex; align-items: center; gap: 6px; }
.flow .cards { display: inline-flex; gap: 4px; }
.flow .arrow { color: var(--faint); }
.claims { display: flex; flex-wrap: wrap; gap: 10px 28px; }
.claimrow { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; position: relative; padding-right: 54px; }
.claimrow .who { color: var(--ink); font-weight: 600; }
.stamp { position: absolute; right: 0; top: 50%; font-family: var(--display); font-weight: 800; font-size: 17px; letter-spacing: .06em; padding: 0 6px; border: 2px solid; border-radius: 4px; transform: translateY(-50%) rotate(-9deg); }
.stamp.lie { color: var(--fas); }
.stamp.true { color: var(--lib); }
.stamp.fresh { animation: stamp .35s cubic-bezier(.3,1.6,.5,1); }
@keyframes stamp { from { transform: translateY(-50%) rotate(-9deg) scale(2.2); opacity: 0; } }
.legis .empty { color: var(--faint); font-size: 13px; }
.powerline { font-size: 13px; }
.powerline b { font-weight: 600; }

.heat { margin-top: 10px; overflow-x: auto; }
.heat table { border-collapse: separate; border-spacing: 3px; margin: 0 auto; }
.heat th { font-family: var(--display); font-weight: 700; font-size: 15px; padding: 2px 6px; color: var(--muted); }
.heat th.rowh { text-align: right; font-family: var(--text); font-weight: 600; font-size: 13px; color: var(--ink); white-space: nowrap; }
.heat th .tag { display: block; height: 3px; border-radius: 2px; margin-top: 2px; }
.heat td { width: 52px; height: 40px; text-align: center; border-radius: 5px; font-size: 13px; font-variant-numeric: tabular-nums; color: #fff; text-shadow: 0 1px 1px rgba(0,0,0,.4); }
.heat td.self, .heat td.none { background: transparent; color: var(--faint); text-shadow: none; }
.heat td.knows { background: repeating-linear-gradient(135deg, #3a2a2a 0 4px, #2d2222 4px 8px); color: var(--muted); font-size: 11px; }
.heat tr.deadrow td, .heat tr.deadrow th { opacity: .35; }
.heatnote { color: var(--muted); font-size: 13px; text-align: center; max-width: 60ch; margin: 12px auto 0; }
.readout { display: flex; justify-content: center; gap: 28px; margin-top: 14px; flex-wrap: wrap; }
.readout div { text-align: center; }
.readout b { display: block; font-family: var(--display); font-size: 32px; line-height: 1; }
.readout span { font-size: 12px; color: var(--muted); }

.right { display: flex; flex-direction: column; min-height: 0; max-height: calc(100vh - 150px); }
.thead { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--felt-edge); flex-wrap: wrap; }
.thead h2 { font-family: var(--display); font-weight: 700; font-size: 20px; margin: 0 auto 0 0; letter-spacing: .02em; }
.seg { display: inline-flex; background: var(--ground); border-radius: 8px; padding: 2px; }
.seg button { background: none; border: 0; padding: 4px 10px; border-radius: 6px; font-size: 13px; color: var(--muted); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--felt-edge); color: var(--ink); }
.chip { font-size: 12px; background: var(--gold); color: #2a2008; border: 0; border-radius: 10px; padding: 1px 9px; cursor: pointer; }
.log { overflow-y: auto; padding: 8px 14px 18px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
.entry { max-width: 64ch; }
.entry .who { font-weight: 600; font-size: 13px; }
.entry .who .r { font-weight: 400; font-size: 11px; padding: 0 6px; border-radius: 7px; margin-left: 4px; vertical-align: 1px; }
.entry .body { font-size: 14.5px; line-height: 1.55; }
.entry.say .body, .entry.claim .body { background: #26343f; padding: 7px 11px; border-radius: 4px 12px 12px 12px; margin-top: 3px; display: inline-block; white-space: pre-wrap; }
.entry.claim .what { font-size: 12px; color: var(--muted); margin-top: 3px; }
.entry.think .body { color: var(--muted); font-style: italic; border-left: 2px dashed var(--faint); padding-left: 10px; margin-top: 2px; white-space: pre-wrap; }
.entry.think .who { color: var(--muted); font-weight: 400; }
.entry.sys { color: var(--muted); font-size: 13px; padding: 6px 0; border-top: 1px solid var(--felt-edge); }
.entry.sys b { color: var(--ink); font-weight: 600; }
.entry.private { color: var(--muted); font-size: 13px; padding-left: 10px; border-left: 2px solid var(--hitler); }
.entry.private.warn { border-left-color: var(--gold); }
.entry .verdict { font-family: var(--display); font-weight: 800; font-size: 14px; letter-spacing: .05em; margin-left: 8px; }
.entry .verdict.lie { color: var(--fas); }
.entry .verdict.true { color: var(--lib); }
.entry .card { width: 20px; height: 28px; font-size: 10px; border-top-width: 6px; }
.entry.round { font-family: var(--display); font-weight: 700; font-size: 18px; color: var(--ink); margin-top: 8px; letter-spacing: .02em; }
.entry.endgame { background: color-mix(in oklab, var(--lib) 25%, var(--felt)); padding: 12px 14px; border-radius: 10px; }
.entry.endgame.fascist { background: color-mix(in oklab, var(--fas) 25%, var(--felt)); }
.entry.endgame .big { font-family: var(--display); font-weight: 800; font-size: 26px; line-height: 1.1; }
.waiting { color: var(--muted); font-size: 13px; font-style: italic; }

.timeline { display: flex; align-items: center; gap: 10px; padding-top: 14px; flex-wrap: wrap; }
.ctrl { background: var(--felt); border: 1px solid var(--felt-edge); border-radius: 8px; width: 38px; height: 34px; cursor: pointer; display: grid; place-items: center; font-size: 14px; }
.ctrl.play { width: 50px; background: var(--ink); color: var(--ground); border-color: var(--ink); }
.speed { background: var(--felt); border: 1px solid var(--felt-edge); border-radius: 8px; height: 34px; padding: 0 8px; font-size: 13px; }
.scrub { flex: 1; min-width: 220px; position: relative; height: 34px; }
.scrub input { position: absolute; inset: 0; width: 100%; margin: 0; opacity: 0; cursor: pointer; z-index: 2; }
.scrub .rail { position: absolute; left: 0; right: 0; top: 50%; height: 4px; transform: translateY(-50%); background: var(--felt-edge); border-radius: 2px; }
.scrub .fill { position: absolute; left: 0; top: 50%; height: 4px; transform: translateY(-50%); background: var(--muted); border-radius: 2px; }
.scrub .knob { position: absolute; top: 50%; width: 14px; height: 14px; border-radius: 50%; background: var(--ink); transform: translate(-50%, -50%); z-index: 1; }
.scrub input:focus-visible ~ .knob { outline: 2px solid var(--gold); outline-offset: 2px; }
.mark { position: absolute; top: 50%; transform: translate(-50%, -50%); pointer-events: none; }
.mark.L, .mark.F { width: 4px; height: 16px; border-radius: 1px; }
.mark.L { background: var(--lib); }
.mark.F { background: var(--fas); }
.mark.lie { width: 9px; height: 9px; background: var(--fas); transform: translate(-50%, -190%) rotate(45deg); }
.mark.kill { color: var(--fas); font-size: 13px; transform: translate(-50%, 40%); font-weight: 700; }
.mark.round { width: 1px; height: 8px; background: var(--faint); transform: translate(-50%, 90%); }
.pos { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 64px; text-align: right; }
.keys { font-size: 12px; color: var(--faint); width: 100%; }
.notice { margin: 15vh auto; max-width: 48ch; text-align: center; color: var(--muted); }
.notice b { display: block; font-family: var(--display); font-size: 28px; color: var(--ink); margin-bottom: 6px; }

@media (max-width: 920px) {
  .stage { grid-template-columns: minmax(0, 1fr); }
  .right { max-height: 70vh; }
}
@media (max-width: 640px) {
  .table { min-height: 330px; aspect-ratio: 1 / 1.05; }
  .board { width: 58%; }
  .seat { width: 78px; }
  .seat .avatar { width: 38px; height: 38px; font-size: 15px; }
  .seat .name { font-size: 11px; max-width: 78px; }
  .bubble { display: none; }
  .slot { font-size: 0; }
  .headline { font-size: 16px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>

<header class="bar">
  <h1><a href="/secret-hitler">Secret Hitler</a></h1>
  <span class="meta" id="gameMeta"></span>
  <span class="live" id="live" hidden>Live</span>
  <span class="spacer"></span>
  <button class="switch" id="spoilers" aria-pressed="true">
    <span class="track" aria-hidden="true"></span><span>Show hidden information</span>
  </button>
</header>

<div class="notice" id="notice" hidden></div>

<main class="stage" id="stage" hidden>
  <section class="pane left">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" aria-selected="true" data-tab="table">Table</button>
      <button class="tab" role="tab" aria-selected="false" data-tab="heat">Suspicion</button>
      <div class="headline" id="headline"></div>
    </div>
    <div id="tableView">
      <div class="table" id="table"><div class="board" id="board"></div></div>
      <div class="legis" id="legis"></div>
    </div>
    <div id="heatView" class="heat" hidden></div>
  </section>

  <aside class="pane right">
    <div class="thead">
      <h2>Transcript</h2>
      <button class="chip" id="focusChip" hidden></button>
      <div class="seg" role="group" aria-label="Transcript filter">
        <button aria-pressed="true" data-filter="all">Everything</button>
        <button aria-pressed="false" data-filter="public">What players saw</button>
      </div>
    </div>
    <div class="log" id="log" aria-live="polite"></div>
  </aside>
</main>

<footer class="timeline" id="timeline" hidden>
  <button class="ctrl" id="restart" aria-label="Back to start">⏮</button>
  <button class="ctrl" id="back" aria-label="Previous event">◀</button>
  <button class="ctrl play" id="play" aria-label="Play">▶</button>
  <button class="ctrl" id="fwd" aria-label="Next event">▶︎▶︎</button>
  <select class="speed" id="speed" aria-label="Playback speed">
    <option value="1">1x</option><option value="2" selected>2x</option><option value="4">4x</option><option value="8">8x</option>
  </select>
  <div class="scrub">
    <div class="rail"></div><div class="fill" id="fill"></div>
    <div id="marks"></div>
    <input type="range" id="range" min="0" value="0" aria-label="Timeline">
    <div class="knob" id="knob"></div>
  </div>
  <span class="pos" id="pos"></span>
  <span class="keys">Space plays or pauses, arrow keys step, H toggles hidden information, click a seat to follow one player.</span>
</footer>

<script>
const GAME_ID = decodeURIComponent(location.pathname.split("/").filter(Boolean).pop());
const API = `/api/v1/secret-hitler/games/${encodeURIComponent(GAME_ID)}`;
const ROLE = { liberal: "Liberal", fascist: "Fascist", hitler: "Hitler" };
const CARD = { L: "liberal", F: "fascist" };
const POWER_NAME = { investigate: "Investigate", peek: "Peek", special_election: "Special election", execute: "Execute" };
const $ = id => document.getElementById(id);
const esc = t => String(t ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

let META = null, PLAYERS = [], E = [], D = [];
const ui = { i: 0, playing: false, spoilers: true, filter: "all", focus: null, tab: "table", timer: null, follow: true };
const nm = s => PLAYERS[s]?.name ?? `Seat ${Number(s) + 1}`;

function powerTrack(n) {
  if (n <= 6) return [null, null, "peek", "execute", "execute"];
  if (n <= 8) return [null, "investigate", "special_election", "execute", "execute"];
  return ["investigate", "investigate", "special_election", "execute", "execute"];
}
function seatLabel(p) {
  return p.kind === "model" ? p.model.split("/").pop() : p.agent_name || "agent";
}
function initials(name) {
  const w = name.trim().split(/\s+/);
  return (w.length > 1 ? w[0][0] + w[1][0] : name.slice(0, 2)).toUpperCase();
}

/* ---------- derive per-event view state from the log ---------- */
const ROLES = {}, KNOWS = {};
function derive(from) {
  let prev = from > 0 ? D[from - 1] : { votes: null, legis: null, beliefs: {} };
  for (let i = from; i < E.length; i++) {
    const e = E[i];
    const d = { votes: prev.votes, legis: prev.legis, beliefs: prev.beliefs };
    const legis = () => (d.legis = d.legis === prev.legis ? { ...(prev.legis || {}), claims: { ...(prev.legis?.claims || {}) } } : d.legis);
    switch (e.k) {
      case "role": ROLES[e.seat] = e.role; KNOWS[e.seat] = e.knows || {}; break;
      case "nom": d.votes = null; d.legis = { claims: {} }; break;
      case "vote": d.votes = e.votes; if (!e.passed) d.legis = null; break;
      case "draw": d.votes = null; break;
      case "hand": Object.assign(legis(), { drawn: e.cards, discarded: e.discarded, passed: e.passed }); break;
      case "receive": legis().got = e.cards; break;
      case "enact": legis().played = e.card; break;
      case "veto_result": legis().veto = e.accepted; break;
      case "claim": legis().claims[e.actor] = e; break;
      case "power": legis().power = { ...e }; break;
      case "investigation": legis().power = { ...(d.legis.power || {}), result: e.party }; break;
      case "peek": legis().peek = e.cards; break;
      case "beliefs": d.beliefs = { ...prev.beliefs, [e.actor]: e.beliefs }; break;
      case "end": for (const [s, r] of Object.entries(e.roles || {})) ROLES[s] = r; break;
    }
    D[i] = d; prev = d;
  }
}

const hiddenFor = e => e.vis === "private";
const isStop = e => e.k !== "beliefs" && e.k !== "role" && e.k !== "setup" && (ui.spoilers || !hiddenFor(e));

/* ---------- seats & board ---------- */
let seatEls = [], seatPos = [];
function buildSeats() {
  const n = PLAYERS.length;
  seatPos = PLAYERS.map((_, i) => {
    const a = -Math.PI / 2 + (i * 2 * Math.PI) / n;
    return { x: 50 + 43 * Math.cos(a), y: 50 + 41 * Math.sin(a) };
  });
  seatEls = PLAYERS.map((p, i) => {
    const el = document.createElement("button");
    el.className = "seat";
    el.style.left = seatPos[i].x + "%";
    el.style.top = seatPos[i].y + "%";
    el.setAttribute("aria-label", `Follow ${p.name}`);
    el.innerHTML = `<span class="hatslot"></span><span class="avatar ${p.kind === "bot" ? "bot" : ""}">${esc(initials(p.name))}</span>
      <span class="name">${esc(p.name)}</span><span class="kind" title="${esc(p.model || p.agent_name || "")}">${p.kind === "bot" ? "bot" : esc(seatLabel(p))}</span>
      <span class="roleslot"></span><span class="ballotslot"></span><span class="bubbleslot"></span>`;
    el.addEventListener("click", () => { ui.focus = ui.focus === i ? null : i; render(); });
    $("table").appendChild(el);
    return el;
  });
}

const card = (c, cls = "") => `<span class="card ${c === "?" ? "back" : c} ${cls}" aria-label="${c === "?" ? "hidden" : CARD[c]} policy">${c === "?" ? "" : c}</span>`;
const cards = (list, hide = false) => list.map(c => card(hide ? "?" : c)).join("");

function renderBoard(st) {
  const track = powerTrack(PLAYERS.length);
  const lib = Array.from({ length: 5 }, (_, i) => `<div class="slot">${i < st.liberal ? card("L") : i === 4 ? "Liberals win" : ""}</div>`).join("");
  const fas = Array.from({ length: 6 }, (_, i) => `<div class="slot">${i < st.fascist ? card("F") : i === 5 ? "Fascists win" : (POWER_NAME[track[i]] || "")}</div>`).join("");
  const pips = [0, 1, 2].map(i => `<span class="pip ${i < st.tracker ? "on" : ""}"></span>`).join("");
  $("board").innerHTML = `
    <div class="trackrow lib" aria-label="Liberal policies ${st.liberal} of 5">${lib}</div>
    <div class="trackrow fas ${st.fascist >= 3 ? "zone" : ""}" aria-label="Fascist policies ${st.fascist} of 6">${fas}</div>
    <div class="boardfoot"><span class="pips" title="Election tracker">Failed votes ${pips}</span>
      <span>Deck ${st.deck}, discard ${st.discard}</span>
      ${st.fascist >= 3 && !st.winner ? `<span class="zonewarn">Electing Hitler as Chancellor now wins it for the fascists</span>` : ""}</div>`;
}

function renderSeats(e, d) {
  const st = e.state, ended = !!st.winner;
  PLAYERS.forEach((p, i) => {
    const el = seatEls[i];
    el.classList.toggle("dead", st.dead.includes(i));
    el.classList.toggle("focus", ui.focus === i);
    const role = ROLES[i];
    el.querySelector(".roleslot").innerHTML = (ui.spoilers || ended) && role ? `<span class="role ${role}">${ROLE[role]}</span>` : "";
    let hat = "";
    if (st.president === i) hat = `<span class="hat">President</span>`;
    else if (st.chancellor === i) hat = `<span class="hat">Chancellor</span>`;
    else if (st.nominee === i) hat = `<span class="hat nom">Nominated</span>`;
    else if (st.not_hitler.includes(i) && !ui.spoilers) hat = `<span class="hat nom">Not Hitler</span>`;
    el.querySelector(".hatslot").innerHTML = hat;
    const v = d.votes && d.votes[i];
    el.querySelector(".ballotslot").innerHTML = v ? `<span class="ballot ${v}">${v === "ja" ? "Ja!" : "Nein"}</span>` : "";
    const speaking = (e.k === "say" || e.k === "claim") && e.actor === i;
    const thinking = ui.spoilers && e.k === "think" && e.actor === i;
    el.classList.toggle("speaking", speaking || (e.k === "nom" && e.president === i));
    el.classList.toggle("thinking", thinking);
    const vert = seatPos[i].y < 50 ? "below" : "above";
    const side = seatPos[i].x < 25 ? "side-l" : seatPos[i].x > 75 ? "side-r" : "";
    let bubble = "";
    if (speaking) bubble = `<span class="bubble ${vert} ${side}">${esc(e.text)}</span>`;
    else if (thinking) bubble = `<span class="bubble thought ${vert} ${side}">${esc(e.text)}</span>`;
    el.querySelector(".bubbleslot").innerHTML = bubble;
  });
}

function claimSummary(c) {
  if (c.office === "president") return `drew ${cards(Array.from({ length: 3 }, (_, k) => k < c.claimed ? "L" : "F"))}`;
  if (c.office === "chancellor") return `got ${cards(Array.from({ length: 2 }, (_, k) => k < c.claimed ? "L" : "F"))}`;
  if (c.office === "investigation") return `says ${esc(nm(c.target))} is <b>${esc(c.claimed)}</b>`;
  return `says the next three hold ${cards(Array.from({ length: 3 }, (_, k) => k < c.claimed ? "L" : "F"))}`;
}

function renderLegis(e, d) {
  const L = d.legis, st = e.state;
  if (!L || (!L.drawn && !L.power && !Object.keys(L.claims).length && !L.played)) {
    $("legis").innerHTML = `<div class="empty">${st.winner ? "Game over." : "Policy cards appear here once a government is elected."}</div>`;
    return;
  }
  const hide = !ui.spoilers, flow = [];
  const pres = st.president, chan = st.chancellor;
  if (L.drawn) {
    let crossed = false;
    const shown = L.drawn.map(c => {
      if (!hide && !crossed && c === L.discarded) { crossed = true; return card(c, "gone"); }
      return card(hide ? "?" : c, e.k === "hand" ? "flip" : "");
    }).join("");
    flow.push(`<span class="step">${esc(nm(pres))} drew <span class="cards">${shown}</span></span>`);
  } else if (st.chancellor !== null && !L.played) {
    flow.push(`<span class="step">${esc(nm(pres))} is drawing</span>`);
  }
  if (L.got) flow.push(`<span class="arrow">→</span><span class="step">${esc(nm(chan))} received <span class="cards">${cards(L.got, hide)}</span></span>`);
  if (L.veto === true) flow.push(`<span class="arrow">→</span><span class="step">vetoed</span>`);
  if (L.played) flow.push(`<span class="arrow">→</span><span class="step">enacted <span class="cards">${card(L.played, e.k === "enact" ? "flip" : "")}</span></span>`);
  const claims = Object.entries(L.claims).map(([who, c]) => {
    const fresh = e.k === "claim" && String(e.actor) === who ? "fresh" : "";
    const stamp = ui.spoilers ? `<span class="stamp ${c.secret.lie ? "lie" : "true"} ${fresh}">${c.secret.lie ? "Lie" : "True"}</span>` : "";
    return `<span class="claimrow"><span class="who">${esc(nm(who))}</span> ${claimSummary(c)}${stamp}</span>`;
  }).join("");
  let pw = "";
  if (L.power) {
    const p = L.power;
    if (p.kind === "investigate") pw = `<b>${esc(nm(p.president))}</b> investigated <b>${esc(nm(p.target))}</b>${ui.spoilers && p.result ? `. The party card read <b style="color:var(--${p.result === "fascist" ? "fas" : "lib"})">${p.result}</b>.` : "."}`;
    if (p.kind === "peek") pw = `<b>${esc(nm(p.president))}</b> peeked at the next three policies${ui.spoilers && L.peek ? `: ${cards(L.peek)}` : "."}`;
    if (p.kind === "special_election") pw = `<b>${esc(nm(p.president))}</b> called a special election and made <b>${esc(nm(p.target))}</b> the next President.`;
    if (p.kind === "execute") pw = `<b>${esc(nm(p.president))}</b> executed <b>${esc(nm(p.target))}</b>.`;
  }
  $("legis").innerHTML = `${flow.length ? `<div class="flow">${flow.join("")}</div>` : ""}
    ${claims ? `<div class="claims">${claims}</div>` : ""}${pw ? `<div class="powerline">${pw}</div>` : ""}`;
}

function renderHeat(e, d) {
  const v = $("heatView"), st = e.state;
  if (!ui.spoilers) { v.innerHTML = `<p class="heatnote">Each agent's beliefs are private. Turn on hidden information to see who suspects whom.</p>`; return; }
  const team = s => ROLES[s] && ROLES[s] !== "liberal";
  let onTeam = 0, nT = 0, onLib = 0, nL = 0;
  const head = PLAYERS.map((t, s) => `<th scope="col" title="${esc(t.name)}">${esc(initials(t.name))}<span class="tag" style="background:var(--${ROLES[s] === "liberal" ? "lib" : ROLES[s] === "hitler" ? "hitler" : "fas"})"></span></th>`).join("");
  const rows = PLAYERS.map((o, os) => {
    const mine = d.beliefs[os] || {}, knows = KNOWS[os] || {};
    const fascistKnows = ROLES[os] === "fascist";
    const cells = PLAYERS.map((t, ts) => {
      if (os === ts) return `<td class="self">·</td>`;
      if (fascistKnows || knows[ts]) return `<td class="knows" title="${esc(o.name)} knows ${esc(t.name)}'s team">knows</td>`;
      const p = mine[ts];
      if (p === undefined) return `<td class="none">–</td>`;
      const pct = Math.round(p * 100);
      if (ROLES[os] === "liberal" && !st.dead.includes(os) && !st.dead.includes(ts)) {
        if (team(ts)) { onTeam += p; nT++; } else { onLib += p; nL++; }
      }
      return `<td style="background:color-mix(in oklab, var(--fas) ${pct}%, #2f6f96)" title="${esc(o.name)} thinks ${esc(t.name)} is on the fascist team: ${pct}%">${pct}</td>`;
    }).join("");
    return `<tr class="${st.dead.includes(os) ? "deadrow" : ""}"><th class="rowh" scope="row">${esc(o.name)}</th>${cells}</tr>`;
  }).join("");
  v.innerHTML = `<table aria-label="Suspicion matrix"><thead><tr><th></th>${head}</tr></thead><tbody>${rows}</tbody></table>
    <p class="heatnote">Each row is one player's latest stated probability that each other player is on the fascist team. Fascists already know the teams.</p>
    <div class="readout">
      <div><b style="color:var(--fas)">${nT ? Math.round(onTeam / nT * 100) + "%" : "–"}</b><span>Liberals' suspicion of the fascist team</span></div>
      <div><b style="color:var(--lib)">${nL ? Math.round(onLib / nL * 100) + "%" : "–"}</b><span>Liberals' suspicion of each other</span></div>
    </div>`;
}

function headline(e) {
  const st = e.state, r = st.round ? `Round ${st.round}` : "Setup";
  const map = {
    nom: () => ["Nomination", `${nm(e.president)} nominates ${nm(e.nominee)}`],
    say: () => ["Discussion", `${nm(e.actor)} speaks`],
    think: () => ["Private reasoning", `${nm(e.actor)} thinks`],
    vote: () => ["Vote", `${e.passed ? "Passed" : "Failed"} ${Object.values(e.votes).filter(v => v === "ja").length} to ${Object.values(e.votes).filter(v => v === "nein").length}`],
    draw: () => ["Legislative session", `${nm(e.president)} draws three policies`],
    hand: () => ["Legislative session", `${nm(e.seat)} discards a policy`],
    receive: () => ["Legislative session", `${nm(e.seat)} chooses a policy`],
    enact: () => ["Legislative session", `${nm(e.chancellor)} enacts a ${CARD[e.card]} policy`],
    claim: () => ["Claims", `${nm(e.actor)} reports`],
    power: () => ["Executive action", POWER_NAME[e.kind]],
    execution: () => ["Executive action", `${nm(e.target)} is dead`],
    end: () => ["Game over", e.winner === "liberal" ? "Liberals win" : e.winner === "fascist" ? "Fascists win" : "No winner"],
  }[e.k];
  const [a, b] = map ? map() : ["Game", ""];
  $("headline").innerHTML = `${a}<small>${r}${b ? `. ${esc(b)}` : ""}</small>`;
}

/* ---------- transcript ---------- */
function who(s) {
  const role = ROLES[s];
  const r = ui.spoilers && role ? `<span class="r ${role}">${ROLE[role]}</span>` : "";
  return `<div class="who">${esc(nm(s))}${r}</div>`;
}
function entryHTML(e) {
  switch (e.k) {
    case "role": {
      const knows = Object.entries(e.knows || {}).map(([s, r]) => `${esc(nm(s))} (${ROLE[r]})`).join(", ");
      return `<div class="entry private">${esc(nm(e.seat))} is ${ROLE[e.role]}${knows ? ` and knows ${knows}` : ""}.</div>`;
    }
    case "nom": return `<div class="entry round">Round ${e.state.round}</div><div class="entry sys"><b>${esc(nm(e.president))}</b> is President${e.special ? " by special election" : ""} and nominates <b>${esc(nm(e.nominee))}</b> for Chancellor.</div>`;
    case "say": return `<div class="entry say">${who(e.actor)}<div class="body">${esc(e.text)}</div></div>`;
    case "think": return `<div class="entry think">${who(e.actor)}<div class="body">${esc(e.text)}</div></div>`;
    case "vote": {
      const ja = Object.entries(e.votes).filter(([, v]) => v === "ja").map(([s]) => nm(s));
      const nein = Object.entries(e.votes).filter(([, v]) => v === "nein").map(([s]) => nm(s));
      return `<div class="entry sys">Vote <b>${e.passed ? "passed" : "failed"}</b> ${ja.length} to ${nein.length}. Ja: ${esc(ja.join(", ") || "nobody")}.${nein.length ? ` Nein: ${esc(nein.join(", "))}.` : ""}</div>`;
    }
    case "hitler_check": return `<div class="entry sys"><b>${esc(nm(e.seat))}</b> is not Hitler.</div>`;
    case "chaos": return `<div class="entry sys">Three failed votes in a row: the top policy, ${card(e.card)} ${CARD[e.card]}, is enacted automatically.</div>`;
    case "draw": return `<div class="entry sys"><b>${esc(nm(e.president))}</b> draws three policies.</div>`;
    case "hand": return `<div class="entry private">${esc(nm(e.seat))} drew ${cards(e.cards)}, discarded ${card(e.discarded)} and passed ${cards(e.passed)}.</div>`;
    case "receive": return `<div class="entry private">${esc(nm(e.seat))} received ${cards(e.cards)}.</div>`;
    case "veto_proposed": return `<div class="entry sys"><b>${esc(nm(e.chancellor))}</b> proposes a veto.</div>`;
    case "veto_result": return `<div class="entry sys"><b>${esc(nm(e.president))}</b> ${e.accepted ? "accepts" : "refuses"} the veto.</div>`;
    case "enact": return `<div class="entry sys"><b>${esc(nm(e.chancellor))}</b> enacted a ${card(e.card)} ${CARD[e.card]} policy.</div>`;
    case "claim": {
      const verdict = ui.spoilers ? `<span class="verdict ${e.secret.lie ? "lie" : "true"}">${e.secret.lie ? "Lie" : "True"}</span>` : "";
      return `<div class="entry claim">${who(e.actor)}<div class="body">${esc(e.text)}</div>${verdict}<div class="what">Claim: ${claimSummary(e)}</div></div>`;
    }
    case "power":
      if (e.kind === "investigate") return `<div class="entry sys"><b>${esc(nm(e.president))}</b> investigates <b>${esc(nm(e.target))}</b>'s party.</div>`;
      if (e.kind === "peek") return `<div class="entry sys"><b>${esc(nm(e.president))}</b> peeks at the next three policies.</div>`;
      if (e.kind === "special_election") return `<div class="entry sys"><b>${esc(nm(e.president))}</b> calls a special election. <b>${esc(nm(e.target))}</b> will be the next President.</div>`;
      return `<div class="entry sys"><b>${esc(nm(e.president))}</b> executes <b>${esc(nm(e.target))}</b>.</div>`;
    case "investigation": return `<div class="entry private">The party card reads <b>${esc(e.party)}</b>.</div>`;
    case "peek": return `<div class="entry private">The next three policies are ${cards(e.cards)}.</div>`;
    case "execution": return `<div class="entry sys"><b>${esc(nm(e.target))}</b> ${e.was_hitler ? "was Hitler." : "was not Hitler, so the game continues."}</div>`;
    case "fallback": return `<div class="entry private warn">A bot made ${esc(nm(e.actor))}'s ${esc(e.decision.replace(/_/g, " "))} decision: ${esc(e.error)}</div>`;
    case "end": {
      const hidden = Object.entries(e.roles || {}).filter(([, r]) => r !== "liberal").map(([s, r]) => `${nm(s)} (${ROLE[r]})`).join(", ");
      const title = e.winner === "liberal" ? "The liberals win." : e.winner === "fascist" ? "The fascists win." : "No winner.";
      return `<div class="entry endgame ${e.winner}"><div class="big">${title}</div>${esc(e.reason[0].toUpperCase() + e.reason.slice(1))}. The hidden team was ${esc(hidden)}.</div>`;
    }
  }
  return "";
}

function renderLog() {
  const parts = [];
  for (let k = 0; k <= ui.i; k++) {
    const e = E[k];
    if ((ui.filter === "public" || !ui.spoilers) && hiddenFor(e)) continue;
    if (e.k === "beliefs" || e.k === "setup") continue;
    if (ui.focus !== null && ![e.actor, e.president, e.chancellor, e.nominee, e.target, e.seat].includes(ui.focus) && !["nom", "end", "vote"].includes(e.k)) continue;
    parts.push(entryHTML(e));
  }
  if (META.status === "running" && ui.i === E.length - 1) parts.push(`<div class="waiting">Waiting for the next move…</div>`);
  const log = $("log");
  log.innerHTML = parts.join("");
  log.scrollTop = log.scrollHeight;
  $("focusChip").hidden = ui.focus === null;
  if (ui.focus !== null) $("focusChip").textContent = `Following ${nm(ui.focus)} ✕`;
}

function renderMarks() {
  const n = Math.max(1, E.length - 1);
  $("marks").innerHTML = E.map((e, i) => {
    const x = (i / n) * 100;
    if (e.k === "enact" || e.k === "chaos") return `<span class="mark ${e.card}" style="left:${x}%"></span>`;
    if (e.k === "claim" && e.secret.lie && ui.spoilers) return `<span class="mark lie" style="left:${x}%"></span>`;
    if (e.k === "execution") return `<span class="mark kill" style="left:${x}%">✕</span>`;
    if (e.k === "nom") return `<span class="mark round" style="left:${x}%"></span>`;
    return "";
  }).join("");
}

function render() {
  if (!E.length) return;
  const e = E[ui.i], d = D[ui.i];
  headline(e);
  renderBoard(e.state);
  renderSeats(e, d);
  renderLegis(e, d);
  renderHeat(e, d);
  renderLog();
  const pct = E.length > 1 ? (ui.i / (E.length - 1)) * 100 : 100;
  $("fill").style.width = pct + "%";
  $("knob").style.left = pct + "%";
  $("range").max = E.length - 1;
  $("range").value = ui.i;
  $("pos").textContent = `${ui.i + 1} of ${E.length}`;
  $("play").textContent = ui.playing ? "❚❚" : "▶";
  $("play").setAttribute("aria-label", ui.playing ? "Pause" : "Play");
  $("live").hidden = META.status !== "running";
}

/* ---------- playback ---------- */
function nextStop(from, dir) {
  for (let k = from + dir; k >= 0 && k < E.length; k += dir) if (isStop(E[k])) return k;
  return dir > 0 ? E.length - 1 : 0;
}
function delayFor(e) {
  const len = (e.text || "").length;
  const base = { say: 900 + len * 22, claim: 900 + len * 22, think: 700 + len * 16, vote: 1800, hand: 1700, enact: 1600, power: 1700, nom: 1400, end: 2000 }[e.k] || 1100;
  return base / Number($("speed").value);
}
function tick() {
  if (!ui.playing) return;
  if (ui.i >= E.length - 1) { ui.playing = META.status === "running"; ui.follow = true; render(); if (ui.playing) ui.timer = setTimeout(tick, 1000); return; }
  ui.i = nextStop(ui.i, 1); render();
  ui.timer = setTimeout(tick, delayFor(E[ui.i]));
}
function setPlaying(p) {
  ui.playing = p; clearTimeout(ui.timer);
  if (p) { if (ui.i >= E.length - 1 && META.status !== "running") ui.i = 0; render(); ui.timer = setTimeout(tick, delayFor(E[ui.i])); }
  else render();
}
const step = dir => { setPlaying(false); ui.i = nextStop(ui.i, dir); ui.follow = ui.i === E.length - 1; render(); };

$("play").onclick = () => setPlaying(!ui.playing);
$("back").onclick = () => step(-1);
$("fwd").onclick = () => step(1);
$("restart").onclick = () => { setPlaying(false); ui.i = 0; ui.follow = false; render(); };
$("range").oninput = ev => { setPlaying(false); ui.i = Number(ev.target.value); ui.follow = ui.i === E.length - 1; render(); };
$("spoilers").onclick = () => { ui.spoilers = !ui.spoilers; $("spoilers").setAttribute("aria-pressed", ui.spoilers); renderMarks(); render(); };
$("focusChip").onclick = () => { ui.focus = null; render(); };
document.querySelectorAll(".seg button").forEach(b => b.onclick = () => {
  ui.filter = b.dataset.filter;
  document.querySelectorAll(".seg button").forEach(x => x.setAttribute("aria-pressed", x === b));
  render();
});
document.querySelectorAll(".tab").forEach(t => t.onclick = () => {
  ui.tab = t.dataset.tab;
  document.querySelectorAll(".tab").forEach(x => x.setAttribute("aria-selected", x === t));
  $("tableView").hidden = ui.tab !== "table";
  $("heatView").hidden = ui.tab !== "heat";
});
document.addEventListener("keydown", ev => {
  if (ev.target.tagName === "SELECT" || ev.target.tagName === "INPUT") return;
  if (ev.key === " ") { ev.preventDefault(); setPlaying(!ui.playing); }
  else if (ev.key === "ArrowRight") { ev.preventDefault(); step(1); }
  else if (ev.key === "ArrowLeft") { ev.preventDefault(); step(-1); }
  else if (ev.key.toLowerCase() === "h") $("spoilers").click();
});

/* ---------- loading and live updates ---------- */
function notice(title, text) {
  $("notice").innerHTML = `<b>${esc(title)}</b>${text}`;
  $("notice").hidden = false;
}
async function fetchGame(since) {
  const r = await fetch(`${API}?since=${since}`);
  if (r.status === 404) return null;
  if (!r.ok) throw new Error(`${r.status} ${r.statusText}`);
  return r.json();
}
async function poll() {
  try {
    const data = await fetchGame(E.length);
    if (data) {
      META = data.meta;
      const wasAtEnd = ui.i >= E.length - 1;
      if (data.events.length) {
        const from = E.length;
        E.push(...data.events);
        derive(from);
        renderMarks();
        if (ui.follow && wasAtEnd && !ui.playing) ui.i = E.length - 1;
      }
      render();
      updateMeta();
    }
  } catch (err) { console.warn("poll failed", err); }
  if (META.status === "running") setTimeout(poll, 1500);
}
function updateMeta() {
  const agents = PLAYERS.filter(p => p.kind !== "bot").length;
  const status = META.status === "running" ? "in progress" : META.status === "failed" ? "failed" : "finished";
  $("gameMeta").textContent = `Game ${GAME_ID.slice(0, 12)} with ${PLAYERS.length} players (${agents} AI, ${PLAYERS.length - agents} bots), ${status}.`;
}
(async function start() {
  let data;
  try { data = await fetchGame(0); }
  catch (err) { notice("Couldn't load this game", `<p>The explorer answered with ${esc(err.message)}. Check that <code>agent-env up</code> is still running.</p>`); return; }
  if (!data) { notice("No game with this id", `<p>It may still be starting. <a href="/secret-hitler">See all games</a>.</p>`); return; }
  META = data.meta; PLAYERS = META.players; E = data.events; D = [];
  if (!E.length) { notice("The game is starting", "<p>Reload in a moment.</p>"); setTimeout(() => location.reload(), 2000); return; }
  derive(0);
  buildSeats();
  $("stage").hidden = false; $("timeline").hidden = false;
  const deep = /e=(\d+)/.exec(location.hash);
  ui.i = deep ? Math.min(E.length - 1, Number(deep[1])) : (META.status === "running" ? E.length - 1 : 0);
  if (/tab=heat/.test(location.hash)) document.querySelector('[data-tab="heat"]').click();
  renderMarks(); render(); updateMeta();
  if (META.status === "running") setTimeout(poll, 1500);
})();
</script>
