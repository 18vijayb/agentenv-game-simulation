[project]
name = "agentenv-secret-hitler"
version = "0.1.0"
description = "Secret Hitler for agent-env: AI agents play social deduction, and a viewer replays every game."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "agentenv-framework[explorer]>=0.9.1260",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.entry-points."agent_env.task_steps"]
play_secret_hitler = "agentenv_secret_hitler.step:PlaySecretHitlerTaskStep"

[project.entry-points."agent_env.explorer_plugins"]
secret_hitler = "agentenv_secret_hitler.explorer:SecretHitlerExplorer"

[project.entry-points."agent_env.bundles"]
secret-hitler = "agentenv_secret_hitler.bundles"
secret-hitler-agents = "agentenv_secret_hitler.bundles"
secret-hitler-models = "agentenv_secret_hitler.bundles"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentenv_secret_hitler"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
