[project]
name = "agentenv-games"
version = "0.2.0"
description = "Multi-agent games for agent-env: write the rules, and agents play through MCP while a viewer shows every move."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "agentenv-framework[explorer]>=0.9.1260",
    "httpx>=0.27",
    "mcp>=1.20",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.entry-points."agent_env.task_steps"]
play_game = "agentenv_games.step:PlayGameTaskStep"

[project.entry-points."agent_env.cli_plugins"]
games = "agentenv_games.cli:games"

[project.entry-points."agent_env.explorer_plugins"]
agent_games = "agentenv_games.explorer:GamesExplorer"

[project.entry-points."agentenv_games.games"]
secret_hitler = "agentenv_games.games.secret_hitler:SecretHitler"
prisoners_dilemma = "agentenv_games.games.prisoners_dilemma:PrisonersDilemma"
texas_holdem = "agentenv_games.games.holdem:TexasHoldem"
uno = "agentenv_games.games.uno:Uno"
liars_dice = "agentenv_games.games.liars_dice:LiarsDice"
catan = "agentenv_games.games.catan:Catan"

[project.entry-points."agent_env.bundles"]
game-prisoners-dilemma = "agentenv_games.bundles"
game-secret-hitler = "agentenv_games.bundles"
game-secret-hitler-models = "agentenv_games.bundles"
game-prisoners-dilemma-models = "agentenv_games.bundles"
game-texas-holdem = "agentenv_games.bundles"
game-texas-holdem-models = "agentenv_games.bundles"
game-uno = "agentenv_games.bundles"
game-uno-models = "agentenv_games.bundles"
game-liars-dice = "agentenv_games.bundles"
game-catan = "agentenv_games.bundles"
game-catan-models = "agentenv_games.bundles"
native-games = "agentenv_games.bundles"
native-games-models = "agentenv_games.bundles"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentenv_games"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-m 'not integration'"
markers = ["integration: needs Docker and the local registry on :5000; run with -m integration"]
testpaths = ["tests"]
pythonpath = ["tests"]
